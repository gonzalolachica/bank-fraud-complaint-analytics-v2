version: 2

models:
  - name: fct_complaints
    description: "Fact table: one row per complaint, with keys to each dimension and the is_fraud_complaint flag."
    config:
      contract:
        enforced: true   # dbt checks column names + types before building; mismatch = build fails
    columns:
      - name: complaint_id
        data_type: bigint
        description: "CFPB complaint ID — the grain of the table."
        data_tests:
          - unique
          - not_null

      - name: date_key
        data_type: integer
        description: "YYYYMMDD integer key to dim_date."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: company_key
        data_type: integer
        description: "Key to dim_company (seed)."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_key

      - name: product_key
        data_type: integer
        description: "Key to dim_product (seed)."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: issue_key
        data_type: bigint
        description: "Key to dim_issue (issue / sub-issue pair)."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_issue')
                field: issue_key

      - name: geography_key
        data_type: bigint
        description: "Key to dim_geography (state; missing state maps to UNK)."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: is_fraud_complaint
        data_type: boolean
        description: "TRUE if product_group = 'Money Transfer / Virtual Currency' OR the issue pair is on the fraud allow-list."

      - name: company_response
        data_type: text
        description: "Company's response to the consumer."

      - name: timely_response
        data_type: text
        description: "Whether the company responded on time (CFPB field)."

      - name: submitted_via
        data_type: text
        description: "Channel the complaint was submitted through (Web, Phone, ...)."

  - name: dim_date
    description: "One row per calendar day, from 2020-01-01 to Dec 31 of the latest complaint year (grows with the data)."
    config:
      contract:
        enforced: true
    columns:
      - name: date_key
        data_type: integer
        description: "Primary key, YYYYMMDD integer."
        data_tests:
          - unique
          - not_null
      - name: full_date
        data_type: date
        description: "Calendar date."
        data_tests:
          - unique
      - name: year
        data_type: integer
        description: "Calendar year."
      - name: quarter
        data_type: integer
        description: "Quarter of the year, 1-4."
      - name: month
        data_type: integer
        description: "Month number, 1-12."
      - name: month_name
        data_type: text
        description: "Full month name, no padding (FMMonth), e.g. 'May'."
      - name: day
        data_type: integer
        description: "Day of the month, 1-31."
      - name: day_of_week
        data_type: integer
        description: "Sunday = 1 ... Saturday = 7 (matches Power BI WEEKDAY default)."
      - name: day_name
        data_type: text
        description: "Full day name, no padding (FMDay), e.g. 'Monday'."
      - name: is_weekend
        data_type: boolean
        description: "TRUE on Saturday and Sunday."

  - name: dim_issue
    description: "One row per distinct issue / sub-issue pair, with the is_fraud_related flag from the allow-list seed."
    config:
      contract:
        enforced: true
    columns:
      - name: issue_key
        data_type: bigint
        description: "Primary key (surrogate)."
        data_tests:
          - unique
          - not_null
      - name: issue
        data_type: text
        description: "CFPB issue category."
      - name: sub_issue
        data_type: text
        description: "CFPB sub-issue (NULL when the issue has none)."
      - name: is_fraud_related
        data_type: boolean
        description: "TRUE if the pair matches the fraud_issue_allowlist seed (11 of 275 pairs at last check)."

  - name: dim_geography
    description: "One row per state code (plus UNK for missing state)."
    config:
      contract:
        enforced: true
    columns:
      - name: geography_key
        data_type: bigint
        description: "Primary key (surrogate)."
        data_tests:
          - unique
          - not_null
      - name: state_code
        data_type: text
        description: "Natural key — fct_complaints joins on this, so it must be unique."
        data_tests:
          - unique
      - name: state_name
        data_type: text
        description: "Full state / territory name from the state_lookup seed (falls back to the code)."
      - name: region
        data_type: text
        description: "Census-style region from state_lookup (South, West, Midwest, Northeast, Territories/Military, Unknown)."